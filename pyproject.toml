[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.2.0"
description = "DeepAgents coding agent with DDD architecture and Astryx workspace UI"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "deepagents>=0.7.41,<0.8",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.domains.skills" = ["builtin/**/*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.11.0",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
